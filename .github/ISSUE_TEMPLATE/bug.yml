name: Bug Report
description: Report a defect in Veku.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Affected package
      placeholder: "@veku/schema"
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps or minimal repo.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, package manager, browser, device, or OS details.

